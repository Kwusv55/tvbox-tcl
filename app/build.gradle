plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvbox.legacy'
    compileSdk 33

    defaultConfig {
        applicationId 'com.tvbox.legacy'
        // TCL firmware shown by the user is Android 4.2.2 (API 17).
        minSdk 17
        // Avoid newer platform behavior on legacy TV firmware.
        targetSdk 25
        versionCode 100
        versionName '1.0.0-tcl'

        // Legacy TCL TVs are 32-bit ARM. Keep x86 for API 17 emulator
        // validation without packing unneeded 64-bit VLC binaries.
        ndk {
            abiFilters 'armeabi-v7a', 'x86'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            // Keep editable rule catalog at repository root and bundle it in APK.
            assets.srcDirs = ['src/main/assets', '../rules']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // ExoPlayer 2.12 keeps API 16+ support and handles HLS master playlists
    // more reliably than the legacy VideoView on Android 4.x firmware.
    implementation 'com.google.android.exoplayer:exoplayer-core:2.13.3'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.13.3'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.13.3'
    // Software H.264 fallback for API 17 decoders that reject High Profile streams.
    implementation 'org.videolan.android:libvlc-all:3.4.9'
    // QR opens file import on a phone without typing the TV address or PIN.
    implementation 'com.google.zxing:core:3.3.3'
}

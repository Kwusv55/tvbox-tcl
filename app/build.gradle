plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvbox.legacy'
    compileSdk 33

    defaultConfig {
        applicationId 'com.tvbox.legacy'
        // TCL firmware shown by the user is Android 4.2.2 (API 17).
        minSdk 17
        // Avoid newer platform behavior on legacy TV firmware.
        targetSdk 25
        versionCode 100
        versionName '1.0.0-tcl'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
